# Render Blueprint — stable public ResQVoice backend and managed Postgres.
#
# The Free plans below are deliberately zero-cost for development. They retain
# a stable *.onrender.com URL, but Render spins a Free web service down after
# 15 minutes without inbound HTTP/WebSocket traffic. Select a paid plan in the
# Render dashboard if an always-on demo is a hard requirement.

databases:
  - name: resqvoice-postgres
    plan: free
    # Must match the existing web service's immutable region so the managed
    # database is reachable over Render's private network.
    region: oregon
    databaseName: resqvoice
    user: resqvoice

services:
  - type: web
    name: resqvoice-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Free Render services do not support preDeployCommand. Run the idempotent
    # migration before Uvicorn instead; the initial migration bootstraps a
    # brand-new managed database.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit

    envVars:
      # Render injects the private Postgres connection string. Do not paste a
      # local DATABASE_URL or commit it to the repository.
      - key: DATABASE_URL
        fromDatabase:
          name: resqvoice-postgres
          property: connectionString

      # The source of truth for Agora's callback. Render supplies this stable
      # public hostname; the backend adds https:// when building webhook URLs.
      - key: AGORA_PUBLIC_BASE_URL
        fromService:
          name: resqvoice-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

      # Values Render prompts for during the first Blueprint creation. Keep all
      # provider credentials out of render.yaml and out of frontend Vite vars.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: AGORA_CUSTOMER_ID
        sync: false
      - key: AGORA_CUSTOMER_SECRET
        sync: false
      - key: AGORA_WEBHOOK_SECRET
        sync: false
      # Comma-separated browser origins. Add the hosted frontend URL here when
      # it exists; local Vite origins are included for development.
      - key: CORS_ALLOW_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:3000

      # Non-secret operational configuration.
      - key: GROQ_TRANSCRIPTION_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_REQUESTS_PER_MINUTE
        value: "18"
      - key: GEMINI_EXTRACTION_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_INTERVENTION_MODEL
        value: gemini-3.5-flash-lite
      - key: EXTRACTION_BATCH_MAX_WORDS
        value: "75"
      - key: EXTRACTION_BATCH_MAX_DURATION_SECONDS
        value: "30"
      - key: EXTRACTION_BATCH_MAX_WAIT_SECONDS
        value: "20"
      - key: INTERVENTION_PERIODIC_SUMMARY_SECONDS
        value: "300"
      - key: INTERVENTION_HIGH_PRIORITY_MODE
        value: interrupt
      - key: INTERVENTION_HIGH_PRIORITY_TRIGGERS
        value: CONFLICT_DETECTED,STALE_CRITICAL_CLAIM
      - key: AGORA_AGENT_PRESET
        value: minimax_speech_2_6_turbo
      - key: AGORA_TTS_CONFIG_JSON
        value: '{"params":{"voice_setting":{"voice_id":"English_captivating_female1","speed":1.0},"audio_setting":{"sample_rate":44100}}}'
      - key: AGORA_VALIDATE_PUBLIC_URL
        value: "true"
